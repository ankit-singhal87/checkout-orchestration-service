openapi: 3.1.0
info:
  title: Checkout Orchestration API
  version: 0.1.0
  summary: Original MVP checkout API inspired by headless checkout concepts.
  description: >
    Phase 2 contract slice for a tenant-aware checkout demo. This is not a
    copy of any vendor OpenAPI document.
  contact:
    name: Checkout Orchestration maintainers
    url: https://gitlab.com/ankit-labs/commerce-platform/checkout-orchestration-service
tags:
  - name: Checkout configuration
    description: Public checkout configuration for the resolved tenant.
  - name: Checkout state
    description: Tenant-aware checkout state creation, reads, and mutations.
  - name: Order confirmation
    description: Idempotent checkout confirmation and conflict responses.
servers:
  - url: http://localhost:8080
    description: Default local/TDD Nginx and PHP-FPM path.
  - url: https://localhost:8443
    description: Local-production parity proxy path.
paths:
  /api/checkout/config:
    get:
      summary: Get public checkout configuration
      description: Return the public checkout settings available to the resolved tenant.
      operationId: getCheckoutConfig
      tags: [Checkout configuration]
      responses:
        "200":
          description: Checkout configuration for the resolved tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutConfig"
  /api/checkout/state:
    put:
      summary: Create or resume checkout state
      description: Create a checkout state or resume the current state for a tenant-visible cart.
      operationId: putCheckoutState
      tags: [Checkout state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutStateCreateRequest"
      responses:
        "200":
          description: Current checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
    get:
      summary: Get current checkout state
      description: Return the current checkout state visible to the resolved tenant.
      operationId: getCheckoutState
      tags: [Checkout state]
      parameters:
        - name: checkoutId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
  /api/checkout/state/address:
    put:
      summary: Update checkout address
      description: Update the checkout address and return the resulting checkout state.
      operationId: putCheckoutAddress
      tags: [Checkout state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutAddressUpdateRequest"
      responses:
        "200":
          description: Updated checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
  /api/checkout/state/basket/items/{variantId}:
    put:
      summary: Update checkout basket item quantity
      description: Set a checkout basket item quantity for the resolved tenant.
      operationId: putCheckoutBasketItem
      tags: [Checkout state]
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkoutId, quantity]
              properties:
                checkoutId:
                  type: string
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 99
              additionalProperties: false
      responses:
        "200":
          description: Updated checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
        "404":
          description: Checkout state or basket item was not visible to the resolved tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/checkout/state/shipping-option:
    put:
      summary: Select shipping option
      description: Select the shipping option and return the resulting checkout state.
      operationId: putShippingOption
      tags: [Checkout state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutShippingOptionRequest"
      responses:
        "200":
          description: Updated checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
  /api/checkout/state/payment-method:
    put:
      summary: Select payment method
      description: Select the payment method and return the resulting checkout state.
      operationId: putPaymentMethod
      tags: [Checkout state]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentMethodRequest"
      responses:
        "200":
          description: Updated checkout state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
  /api/checkout/state/order-confirmation:
    post:
      summary: Confirm order
      description: Confirm the checkout idempotently and return the order confirmation.
      operationId: postOrderConfirmation
      tags: [Order confirmation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderConfirmationRequest"
      responses:
        "200":
          description: Confirmed order summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "409":
          description: Checkout conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    checkoutToken:
      type: http
      scheme: bearer
      bearerFormat: signed-checkout-token
    checkoutSession:
      type: apiKey
      in: cookie
      name: checkout_session
  schemas:
    CheckoutConfig:
      type: object
      required: [tenant, shippingOptions, paymentMethods, features]
      properties:
        tenant:
          type: object
          required: [id, shop, displayName, currency, locale, primaryColor, trustBadges]
          properties:
            id:
              type: string
            shop:
              type: string
            displayName:
              type: string
            currency:
              type: string
            locale:
              type: string
            primaryColor:
              type: string
            trustBadges:
              type: array
              items:
                type: string
        shippingOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOption"
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
        features:
          type: object
    CheckoutState:
      type: object
      required: [checkoutId, tenant, shop, status, basket, totals, nextActions]
      properties:
        checkoutId:
          type: string
        tenant:
          type: string
        shop:
          type: string
        status:
          type: string
          enum: [created, addressed, shipping_selected, payment_selected, failed, confirmed]
        basket:
          $ref: "#/components/schemas/Basket"
        shippingAddress:
          type: object
        shippingOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOption"
        paymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
        totals:
          type: object
        nextActions:
          type: array
          items:
            type: string
        validationErrors:
          type: array
          items:
            type: object
    CheckoutStateCreateRequest:
      type: object
      required: [cartId]
      properties:
        cartId:
          type: string
      additionalProperties: false
    CheckoutAddressUpdateRequest:
      type: object
      required: [checkoutId, shippingAddress]
      properties:
        checkoutId:
          type: string
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
      additionalProperties: false
    CheckoutShippingOptionRequest:
      type: object
      required: [checkoutId, shippingOption]
      properties:
        checkoutId:
          type: string
        shippingOption:
          type: string
          enum: [standard, express]
      additionalProperties: false
    CheckoutPaymentMethodRequest:
      type: object
      required: [checkoutId, paymentMethod]
      properties:
        checkoutId:
          type: string
        paymentMethod:
          type: string
          enum: [invoice, card]
      additionalProperties: false
    OrderConfirmationRequest:
      type: object
      required: [checkoutId, idempotencyKey]
      properties:
        checkoutId:
          type: string
        idempotencyKey:
          type: string
          minLength: 1
      additionalProperties: false
    ShippingAddress:
      type: object
      required: [name, line1, postalCode, city, country]
      properties:
        name:
          type: string
        line1:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
      additionalProperties: false
    ShippingOption:
      type: object
      required: [id, label, amount, currency]
      properties:
        id:
          type: string
          enum: [standard, express]
        label:
          type: string
        amount:
          type: integer
        currency:
          type: string
        selected:
          type: boolean
    PaymentMethod:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          enum: [invoice, card]
        label:
          type: string
        selected:
          type: boolean
    Basket:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
    BasketItem:
      type: object
      required: [productName, variantId, quantity, unitPrice]
      properties:
        productName:
          type: string
        variantId:
          type: string
        options:
          type: object
        quantity:
          type: integer
          minimum: 0
        unitPrice:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: integer
            currency:
              type: string
    OrderConfirmation:
      type: object
      required: [tenant, shop, orderRef, status, total]
      properties:
        tenant:
          type: string
        shop:
          type: string
        orderRef:
          type: string
        status:
          type: string
          enum: [confirmed]
        total:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: integer
            currency:
              type: string
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        tenant:
          type: string
          description: Public tenant slug when it is safe to expose.
          examples: [fashion-store]
        shop:
          type: string
          description: Public shop slug when it is safe to expose.
          examples: [fashion-main]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
    ProblemError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          examples: [shippingAddress.postalCode]
        code:
          type: string
          examples: [required]
        message:
          type: string
