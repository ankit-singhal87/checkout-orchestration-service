stages:
  - validate

default:
  image: alpine:3.20
  before_script:
    - apk add --no-cache git

validate:scaffold:
  stage: validate
  variables:
    GIT_DEPTH: "0"
  script:
    - sh scripts/ci/validate-scaffold.sh
    - sh scripts/ci/validate-phase1.sh
    - target_branch="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}"
    - git fetch --no-tags origin "$target_branch:refs/remotes/origin/$target_branch"
    - sh scripts/git/check-migration-immutability.sh "origin/$target_branch"
  rules:
    - when: always

checkout:tests:
  stage: validate
  image: composer:2
  services:
    - name: mysql:8.4
      alias: mysql
    - name: redis:7.4
      alias: redis
  variables:
    CHECKOUT_TEST_RUNTIME: host
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: checkout_testing
    DB_USERNAME: root
    DB_PASSWORD: checkout_root
    MYSQL_DATABASE: checkout_testing
    MYSQL_USER: checkout
    MYSQL_PASSWORD: checkout
    MYSQL_ROOT_PASSWORD: checkout_root
  before_script: []
  script:
    - apk add --no-cache linux-headers
    - docker-php-ext-install pdo_mysql sockets
    - composer install --working-dir=apps/checkout --no-interaction --prefer-dist
    - sh scripts/test/checkout-app.sh
  rules:
    - when: always

checkout:runtime-smoke:
  stage: validate
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl make
  script:
    - make test-checkout-runtime
  rules:
    - when: always

checkout:parity-smoke:
  stage: validate
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl make
  script:
    - make test-checkout-parity
  rules:
    - when: always

worker:runtime-smoke:
  stage: validate
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache make
  script:
    - make test-worker-runtime-smoke
  rules:
    - changes:
        - .gitlab-ci.yml
        - Makefile
        - scripts/test/worker-runtime.sh
        - scripts/test/order-processor-runtime.sh
        - wiki/runbooks/local-tools.md
        - wiki/runbooks/demo.md
        - docker-compose.yml
        - docker/checkout.Dockerfile
        - apps/checkout/app/Console/**
        - apps/checkout/app/Application/Outbox/**
        - apps/checkout/app/Application/Orders/**
        - apps/checkout/database/migrations/**
      when: always
    - when: never
