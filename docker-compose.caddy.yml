name: checkout-orchestration

services:
  checkout:
    profiles: !reset []

  nginx:
    profiles: !reset []
    ports: !reset []
    expose:
      - "80"

  checkout-proxy:
    image: caddy:2.8-alpine
    depends_on:
      - nginx
    ports:
      - "${CADDY_HTTPS_PORT:-${PARITY_HTTPS_PORT:-8443}}:443"
      - "${CADDY_HTTPS_PORT:-${PARITY_HTTPS_PORT:-8443}}:443/udp"
    volumes:
      - ./infra/local/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
