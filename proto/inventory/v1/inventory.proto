syntax = "proto3";

package inventory.v1;

option go_package = "checkout-orchestration-service/proto/inventory/v1;inventoryv1";

service InventoryService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Materialize(MaterializeRequest) returns (MaterializeResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

message InventoryItem {
  string sku = 1;
  string variant_id = 2;
  int32 quantity = 3;
}

message ReserveRequest {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
  string reservation_expires_at = 4;
}

message ReserveResponse {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
  string reservation_expires_at = 4;
  string status = 5;
}

message MaterializeRequest {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
}

message MaterializeResponse {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
  string status = 4;
}

message ReleaseRequest {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
}

message ReleaseResponse {
  string tenant_id = 1;
  string order_id = 2;
  repeated InventoryItem items = 3;
  string status = 4;
}
